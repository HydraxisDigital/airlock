[package]
name = "airlock"
version = "1.0.0"
edition = "2021"
description = "Scaffolding sécurisé pour projets isolés via Dev Containers"

[lib]
name = "airlock"
path = "src/lib.rs"

[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
which = "6"
console = "0.15"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
